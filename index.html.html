<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#17223d"><title>Dog Gunner 🐶</title><style>*{box-sizing:border-box}body{margin:0;background:#10182b;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}#game{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;align-items:start;pointer-events:none;font-weight:800;text-shadow:0 2px 4px #000}#stats{background:#152443b9;border:2px solid #ffffff55;border-radius:14px;padding:7px 11px;font-size:13px;line-height:1.7}#actions{pointer-events:auto;display:flex;gap:6px}button{border:2px solid #fff8;border-radius:13px;background:#344c83;color:white;padding:9px 11px;font-weight:800}#overlay{position:fixed;inset:0;background:#0a1224d9;display:flex;align-items:center;justify-content:center;padding:18px}#panel{width:min(420px,100%);max-height:85dvh;overflow:auto;background:linear-gradient(#314b87,#1b2a50);border:3px solid #8bdcfb;border-radius:23px;padding:20px;text-align:center;box-shadow:0 12px 50px #0009}h1{font-size:35px;margin:0 0 8px;color:#ffe783;text-shadow:3px 3px #a7555d}p{line-height:1.5}#panel button{margin:5px;background:#f6ad43;color:#29203d;border-color:#ffe8a1;min-height:44px}#panel .shop{background:#9de2f4}.muted{opacity:.8;font-size:13px}#joystick{position:fixed;bottom:calc(25px + env(safe-area-inset-bottom));left:25px;width:118px;height:118px;border-radius:100%;border:3px solid #ffffff66;background:#ffffff20;display:none;pointer-events:none}#knob{position:absolute;left:37px;top:37px;width:40px;height:40px;border-radius:100%;background:#fff9;border:2px solid white}#hint{position:fixed;bottom:calc(13px + env(safe-area-inset-bottom));right:15px;font-size:12px;color:#fffc;text-shadow:1px 1px #000;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="stats">❤️ <span id="hp">100</span>　💎 <span id="gems">0</span><br>🌊 Welle <span id="wave">1</span>　⭐ <span id="kills">0</span></div><div id="actions"><button id="pause">⏸</button><button id="shop">🛍️</button></div></div><div id="joystick"><div id="knob"></div></div><div id="hint">Bewegen: linker Daumen · Schiessen: automatisch</div><div id="overlay"><div id="panel"></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel'),joy=document.querySelector('#joystick'),knob=document.querySelector('#knob');let W=0,H=0,dpr=1,mode='menu',last=0,elapsed=0,spawn=0,shot=0,wave=1,kills=0,gems=0,enemyId=0,invuln=0;let enemies=[],bullets=[],particles=[],drops=[],keys={},pointer=null,axis={x:0,y:0};const player={x:0,y:0,r:19,hp:100,max:100,speed:205,damage:15,fire:.43,pet:0,weapon:0};let save={};try{save=JSON.parse(localStorage.getItem('doggunner-save')||'{}')}catch{}gems=save.gems||0;player.damage=save.damage||15;player.max=save.max||100;player.hp=player.max;player.fire=save.fire||.43;player.pet=save.pet||0;player.weapon=save.weapon||0;function persist(){try{localStorage.setItem('doggunner-save',JSON.stringify({gems,damage:player.damage,max:player.max,fire:player.fire,pet:player.pet,weapon:player.weapon}))}catch{}}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);player.x=player.x||W/2;player.y=player.y||H*.6}addEventListener('resize',resize);resize();function ui(){document.querySelector('#hp').textContent=Math.ceil(player.hp)+'/'+player.max;document.querySelector('#gems').textContent=gems;document.querySelector('#wave').textContent=wave;document.querySelector('#kills').textContent=kills}function show(html){panel.innerHTML=html;overlay.style.display='flex'}function hide(){overlay.style.display='none'}function menu(){mode='menu';show('<h1>🐶 DOG GUNNER</h1><p>Rette den Hundepark vor den frechen Monstern! Sammle Diamanten, verbessere deine Blaster und kämpfe mit süssen Pets.</p><p>🐕 🐾 🦊 🐉</p><button data-act="start">▶️ Spielen</button><button class="shop" data-act="shop">💎 Upgrade-Shop</button><p class="muted">iPhone: Links ziehen zum Laufen. Dein Hund schiesst automatisch auf das nächste Monster.</p>')}function start(){mode='play';hide();joy.style.display='block';enemies=[];bullets=[];drops=[];particles=[];wave=1;kills=0;elapsed=0;spawn=0;shot=0;invuln=0;player.hp=player.max;player.x=W/2;player.y=H*.55;ui()}function shop(){const back=mode==='play'?'resume':'menu';mode='shop';joy.style.display='none';const costD=Math.round(15*Math.pow(1.55,(player.damage-15)/5)),costH=Math.round(12*Math.pow(1.5,(player.max-100)/20)),costF=Math.round(20*Math.pow(1.7,Math.round((.43-player.fire)/.045))),costP=35+player.pet*55,costW=70+player.weapon*110;show(`<h1>🛍️ Hunde-Shop</h1><p>💎 ${gems} Diamanten</p><p>🔫 Schaden: ${player.damage}　❤️ Leben: ${player.max}<br>⚡ Feuerrate: ${(1/player.fire).toFixed(1)}/s　🐾 Pets: ${player.pet}</p><button data-buy="damage" data-cost="${costD}">🔫 +5 Schaden · 💎 ${costD}</button><button data-buy="max" data-cost="${costH}">❤️ +20 Leben · 💎 ${costH}</button><button data-buy="fire" data-cost="${costF}">⚡ Schneller schiessen · 💎 ${costF}</button><button data-buy="pet" data-cost="${costP}">🐾 Neues Pet · 💎 ${costP}</button><button data-buy="weapon" data-cost="${costW}">🌈 Blaster-Stufe +1 · 💎 ${costW}</button><p class="muted">Pets schiessen zusätzliche Projektile. Upgrades bleiben gespeichert.</p><button data-act="${back}">↩ Zurück</button>`)}panel.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.buy){let c=+b.dataset.cost;if(gems<c){b.textContent='💎 Zu wenig Diamanten!';return}gems-=c;let k=b.dataset.buy;if(k==='damage')player.damage+=5;if(k==='max'){player.max+=20;player.hp=Math.min(player.max,player.hp+20)}if(k==='fire')player.fire=Math.max(.12,player.fire*.895);if(k==='pet')player.pet=Math.min(5,player.pet+1);if(k==='weapon')player.weapon++;persist();ui();shop()}else if(b.dataset.act==='start')start();else if(b.dataset.act==='shop')shop();else if(b.dataset.act==='resume'){mode='play';hide();joy.style.display='block';last=performance.now()}else if(b.dataset.act==='menu')menu()});document.querySelector('#shop').onclick=()=>{if(mode==='play'||mode==='menu')shop()};document.querySelector('#pause').onclick=()=>{if(mode==='play'){mode='pause';joy.style.display='none';show('<h1>⏸ Pause</h1><button data-act="resume">▶️ Weiter</button><button data-act="shop">🛍️ Shop</button><button data-act="menu">🏠 Hauptmenü</button>')}else if(mode==='pause'){mode='play';hide();joy.style.display='block';last=performance.now()}};function touchMove(x,y){if(!pointer)return;let dx=x-pointer.x,dy=y-pointer.y,len=Math.hypot(dx,dy),max=38;axis.x=dx/Math.max(max,len);axis.y=dy/Math.max(max,len);knob.style.transform=`translate(${axis.x*max}px,${axis.y*max}px)`}canvas.addEventListener('pointerdown',e=>{if(mode!=='play'||pointer||e.clientX>W*.7)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY};joy.style.left=(e.clientX-59)+'px';joy.style.top=(e.clientY-59)+'px';joy.style.bottom='auto';canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(pointer?.id===e.pointerId)touchMove(e.clientX,e.clientY)});function release(e){if(pointer?.id===e.pointerId){pointer=null;axis.x=axis.y=0;knob.style.transform='none';joy.style.left='25px';joy.style.top='auto';joy.style.bottom='calc(25px + env(safe-area-inset-bottom))'}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function addParticle(x,y,color,n=5){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*130,life:.3+Math.random()*.4,color})}function spawnEnemy(){let side=Math.floor(Math.random()*4),x=side===0?-30:side===1?W+30:Math.random()*W,y=side===2?-30:side===3?H+30:Math.random()*H;let boss=wave%5===0&&Math.random()<.12;enemies.push({id:++enemyId,x,y,r:boss?35:14+Math.random()*7,hp:(boss?130:25)*(1+wave*.24),max:(boss?130:25)*(1+wave*.24),speed:(boss?43:65)+Math.random()*27+wave*2,boss,phase:Math.random()*6})}function shoot(x,y,tx,ty,damage,color='#ffe47b'){let d=Math.hypot(tx-x,ty-y)||1;bullets.push({x,y,vx:(tx-x)/d*480,vy:(ty-y)/d*480,damage,life:1.5,color})}function nearest(x,y){let best=null,dist=Infinity;for(const e of enemies){let d=(e.x-x)**2+(e.y-y)**2;if(d<dist){dist=d;best=e}}return best}function update(dt){elapsed+=dt;wave=1+Math.floor(elapsed/24);spawn-=dt;shot-=dt;invuln-=dt;if(spawn<=0){spawnEnemy();spawn=Math.max(.17,1.1-wave*.065)}let mx=axis.x+(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),my=axis.y+(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0),l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}player.x=Math.max(22,Math.min(W-22,player.x+mx*player.speed*dt));player.y=Math.max(95,Math.min(H-26,player.y+my*player.speed*dt));let target=nearest(player.x,player.y);if(target&&shot<=0){shoot(player.x,player.y,target.x,target.y,player.damage+player.weapon*9,player.weapon?'#81edff':'#ffe47b');for(let i=0;i<player.pet;i++){let a=elapsed*1.8+i*6.28/player.pet,px=player.x+Math.cos(a)*40,py=player.y+Math.sin(a)*40;shoot(px,py,target.x,target.y,Math.max(6,player.damage*.4),'#fca5ff')}shot=player.fire}for(const e of enemies){let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;if(d<e.r+player.r&&invuln<=0){player.hp-=e.boss?24:12;invuln=.65;addParticle(player.x,player.y,'#ff8d9b',12);if(player.hp<=0){player.hp=0;mode='dead';joy.style.display='none';persist();show(`<h1>💔 Game Over</h1><p>🌊 Welle ${wave} · ⭐ ${kills} besiegte Monster</p><p>💎 Du hast ${gems} Diamanten.</p><button data-act="start">🔁 Nochmal spielen</button><button data-act="shop">🛍️ Upgrades</button>`)} } }for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(const e of enemies){if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){e.hp-=b.damage;b.life=0;addParticle(b.x,b.y,'#ffdd81',3);if(e.hp<=0){kills++;let reward=e.boss?12:Math.random()<.3?2:1;drops.push({x:e.x,y:e.y,val:reward});addParticle(e.x,e.y,e.boss?'#ff81c1':'#c6a5ff',12)}break}}}enemies=enemies.filter(e=>e.hp>0);bullets=bullets.filter(b=>b.life>0&&b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30);for(const d of drops){let dx=player.x-d.x,dy=player.y-d.y,dist=Math.hypot(dx,dy)||1;if(dist<125){d.x+=dx/dist*360*dt;d.y+=dy/dist*360*dt}if(dist<26){gems+=d.val;d.taken=true;persist()}}drops=drops.filter(d=>!d.taken);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);ui()}function emoji(s,x,y,size){ctx.font=`${size}px Apple Color Emoji,Segoe UI Emoji,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}function render(){ctx.fillStyle='#79c9aa';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff16';ctx.lineWidth=1;for(let x=0;x<W;x+=44){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=44){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=0;i<12;i++){let x=(i*173+41)%Math.max(1,W),y=(i*251+118)%Math.max(1,H);emoji(i%3===0?'🌼':'🌿',x,y,17)}for(const d of drops)emoji('💎',d.x,d.y,19);for(const e of enemies){emoji(e.boss?'👹':'👾',e.x,e.y,e.boss?65:37);ctx.fillStyle='#421a37';ctx.fillRect(e.x-e.r,e.y-e.r-15,e.r*2,5);ctx.fillStyle='#fa677b';ctx.fillRect(e.x-e.r,e.y-e.r-15,e.r*2*Math.max(0,e.hp/e.max),5)}for(const b of bullets){ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,5,0,7);ctx.fill()}for(let i=0;i<player.pet;i++){let a=elapsed*1.8+i*6.28/player.pet;emoji(['🦊','🐱','🐰','🐉','🐼'][i%5],player.x+Math.cos(a)*42,player.y+Math.sin(a)*42,28)}ctx.globalAlpha=invuln>0&&Math.floor(invuln*12)%2===0?.45:1;ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.ellipse(player.x,player.y+17,22,8,0,0,7);ctx.fill();emoji('🐶',player.x,player.y,45);emoji(player.weapon?'🔫':'💥',player.x+19,player.y+8,21);ctx.globalAlpha=1;for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,5,5)}ctx.globalAlpha=1;if(mode==='play'&&wave>1&&Math.floor(elapsed)%24===0){ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.fillText('WELLE '+wave,W/2,80)}}function frame(t){let dt=Math.min((t-last)/1000||0,.05);last=t;if(mode==='play')update(dt);render();requestAnimationFrame(frame)}menu();ui();requestAnimationFrame(frame)})();
</script></body></html>
