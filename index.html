*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#20314e;color:white;font-family:system-ui,Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#ui{position:absolute;inset:0;pointer-events:none;text-shadow:0 2px 0 #14233b,1px 0 #14233b,-1px 0 #14233b}button{touch-action:manipulation;cursor:pointer;border:2px solid #0d203c;border-bottom-width:5px;border-radius:10px;background:linear-gradient(#ffd96a,#ee9e37);color:#fff;font-weight:1000;font-size:12px;text-shadow:0 2px #754018;box-shadow:inset 0 2px #fff8;padding:7px 9px}button:active{transform:translateY(2px);border-bottom-width:3px}.panel{background:linear-gradient(#263c60,#172743);border:2px solid #091a34;box-shadow:inset 0 2px #607caa,0 3px #091a34;border-radius:9px;padding:5px 8px}#top{position:absolute;top:max(6px,env(safe-area-inset-top));left:7px;right:7px;display:flex;gap:5px;align-items:start;justify-content:space-between}#profile{min-width:95px;font-weight:1000;font-size:13px}#profile small{display:block;font-size:10px;color:#ffe383}#curr{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}#curr .panel{font-size:12px;font-weight:1000;white-space:nowrap}#topmenu{display:flex;gap:3px}#topmenu button{padding:6px;font-size:16px}#stage{position:absolute;top:69px;left:50%;transform:translateX(-50%);text-align:center;min-width:150px;font-weight:1000;font-size:15px}#stage small{font-size:11px}#progress{height:8px;border-radius:9px;background:#13243b;border:1px solid #fff8;margin:4px auto;width:140px;overflow:hidden}#progress i{display:block;height:100%;width:10%;background:linear-gradient(90deg,#ffcc3c,#6ff4f0)}#leftmenu,#rightmenu{position:absolute;top:119px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}#leftmenu{left:6px}#rightmenu{right:6px}#leftmenu button,#rightmenu button{font-size:11px;padding:5px 7px;min-width:61px;background:linear-gradient(#3e6795,#233d65);text-shadow:0 2px #0e223f}#left try{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px;background:#0b203d88;border:1px solid #6785b4;border-radius:9px;margin:6px 0;font-size:13px}.entry button{flex-shrink:0}.desc{font-size:12px;color:#d5e5ff}#close{width:100%;margin-top:9px}@media(max-width:480px){#topmenu button{font-size:13px;padding:4px}#profile{font-size:11px;min-width:75px}#curr .panel{font-size:10px;padding:5px}#leftmenu button,#rightmenu button{min-width:54px;font-size:9px}#stage{top:62px}#leftmenu,#rightmenu{top:109px}#controls{bottom:117px}#auto{bottom:208px}#tabs button{font-size:9px}#tabs button b{font-size:18px}}@media(max-height:650px){#leftmenu,#rightmenu{gap:2px}#leftmenu button,#rightmenu button{padding:2px 5px}#controls{bottom:112px}#auto{bottom:195px}}
</style></head><body><canvas id="game"></canvas><div id="ui"><div id="top"><div id="profile" class="panel">🐶 Dog Gunner<small>Lv. <span id="level">1</span> · <span id="xp">0</span> XP</small></div><div id="curr"><div class="panel">🪙 <span id="coins">0</span></div><div class="panel">💎 <span id="gems">0</span></div></div><div id="topmenu"><button data-menu="quest">📜</button><button data-menu="shop">🏪</button><button data-menu="help">☰</button></div></div><div id="stage">🌳 Wald <span id="area">1</span>-<span id="wave">1</span><div id="progress"><i id="prog"></i></div><small id="target">Bäume zerstören!</small></div><div id="leftmenu"><button data-menu="pets"><b>🐾</b>Pets</button><button data-menu="weapon"><b>🔫</b>Waffen</button><button data-menu="skins"><b>🐶</b>Skins</button><button data-menu="merge"><b>✨</b>Fusion</button></div><div id="rightmenu"><button data-menu="quest"><b>🏆</b>Quest</button><button data-menu="shop"><b>🎁</b>Shop</button><button data-menu="help"><b>⚙️</b>Hilfe</button></div><div id="toast"></div><button id="auto" class="on">⚔️ AUTO AN</button><div id="controls"><div id="joystick"><div id="knob"></div></div><button id="fire"><b>💥</b>FEUER</button></div><div id="bottom"><div id="stats"><span>⚔️ <i id="attack">10</i> ATK</span><span>❤️ <i id="health">100</i> HP</span><span>⚡ <i id="speed">1.0</i> SPD</span></div><div id="tabs"><button class="active" data-menu="growth"><b>🐶</b>Upgrade</button><button data-menu="weapon"><b>🔫</b>Waffen</button><button data-menu="pets"><b>🐾</b>Pets</button><button data-menu="merge"><b>✨</b>Fusion</button><button data-menu="skins"><b>🎨</b>Skins</button><button data-menu="shop"><b>🏪</b>Shop</button></div></div><div id="modal"><div id="dialog"><h2 id="title"></h2><div id="content"></div><button id="close">⬅️ Weiter spielen</button></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let W=0,H=0,scale=1,t=0,last=0,cam=0,shots=[],particles=[],texts=[],targets=[],keys={},move=0,fire=false,auto=true,modal=false,shootClock=0,spawnClock=0;const skins=['🐕','🐶','🐩','🐺','🦊','🐕‍🦺'],petTypes=['🐣','🐰','🐼','🦊','🐸','🐲'];const initial={coins:100,gems:25,level:1,xp:0,wave:1,area:1,atk:1,rate:1,gun:0,skin:0,unlocked:[0],pets:[{kind:0,tier:1}],kills:0};let s;try{s=Object.assign({},initial,JSON.parse(localStorage.getItem('doggunner-pixel-v2')||'{}'))}catch(e){s={...initial}};s.pets=Array.isArray(s.pets)?s.pets:initial.pets;s.unlocked=Array.isArray(s.unlocked)?s.unlocked:[0];let hero={x:150,y:0},ground=0;function save(){try{localStorage.setItem('doggunner-pixel-v2',JSON.stringify(s))}catch(e){}}setInterval(save,4000);addEventListener('pagehide',save);function resize(){W=innerWidth;H=innerHeight;scale=Math.min(devicePixelRatio||1,2);canvas.width=W*scale;canvas.height=H*scale;ctx.setTransform(scale,0,0,scale,0,0);ctx.imageSmoothingEnabled=false;ground=H-Math.max(113,Math.min(145,H*.21))-12;hero.y=ground}addEventListener('resize',resize);resize();const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function txt(st,x,y,size=16,color='#fff'){ctx.font=`900 ${size}px system-ui`;ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#18304a';ctx.strokeText(st,x,y);ctx.fillStyle=color;ctx.fillText(st,x,y)}function poly(points,c){ctx.fillStyle=c;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill()}function toast(st){$('toast').textContent=st;$('toast').style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.opacity=0,1300)}function hud(){$('level').textContent=s.level;$('xp').textContent=s.xp;$('coins').textContent=Math.floor(s.coins).toLocaleString('de-CH');$('gems').textContent=s.gems;$('wave').textContent=s.wave;$('area').textContent=s.area;$('attack').textContent=Math.floor(damage());$('health').textContent=100+s.level*10;$('speed').textContent=(1+(s.rate-1)*.15).toFixed(1);$('prog').style.width=`${(s.kills%5)/5*100}%`;$('target').textContent=s.wave%5===0?'👑 Boss-Welle!':'🌳 Zerstöre die Bäume'}function damage(){return (10+s.atk*6)*(1+s.gun*.65)}function reward(boss=false){s.coins+=boss?140+s.wave*30:20+s.wave*5;s.xp+=boss?60:18;if(Math.random()<.14||boss)s.gems+=boss?8:1;if(s.xp>=s.level*75){s.xp=0;s.level++;toast('⭐ LEVEL UP!')}s.kills++;if(s.kills%5===0){s.wave++;if(s.wave>10){s.wave=1;s.area++;toast('🌈 Neue Welt!')}else toast('🎉 Welle geschafft!')}hud();save()}function spawn(){let boss=s.wave%5===0;targets.push({x:hero.x+rand(310,550),hp:(boss?250:70)*(1+s.area*.55+s.wave*.17),max:(boss?250:70)*(1+s.area*.55+s.wave*.17),boss,r:boss?52:31,shake:0});}for(let i=0;i<3;i++)spawn();function burst(x,y,c,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-130,130),vy:rand(-180,30),life:rand(.25,.7),color:c,size:rand(3,7)})}function hit(a,d){a.hp-=d;a.shake=.13;burst(a.x,ground-a.r,'#ffcb59',5);texts.push({x:a.x,y:ground-a.r-10,text:'-'+Math.floor(d),life:.7});if(a.hp<=0){burst(a.x,ground-a.r,'#f5bf3e',20);texts.push({x:a.x,y:ground-a.r-38,text:a.boss?'💎 +8':'🪙 +'+(20+s.wave*5),life:1.3});targets.splice(targets.indexOf(a),1);reward(a.boss);spawn()}}function shoot(fromPet=false,index=0){let target=targets.filter(a=>a.x>hero.x-30).sort((a,b)=>a.x-b.x)[0];if(!target)return;let x=hero.x+(fromPet?-35-index*22:23),y=ground-(fromPet?64+index%2*23:38);shots.push({x,y,target,v:fromPet?450:620,d:damage()*(fromPet?.18*s.pets[index].tier:1),pet:fromPet});burst(x,y,'#fff0a2',3)}function update(dt){t+=dt;if(modal)return;hero.x=clamp(hero.x+move*dt*190,70,1e8);cam+=(Math.max(0,hero.x-W*.36)-cam)*Math.min(1,dt*4);shootClock-=dt;if((auto||fire||keys[' '])&&shootClock<=0){shoot();shootClock=Math.max(.12,.5/(1+(s.rate-1)*.18))}if(Math.random()<dt*1.5&&s.pets.length)shoot(true,Math.floor(Math.random()*s.pets.length));for(let a of targets){a.shake=Math.max(0,a.shake-dt);if(a.x<hero.x-80)a.x=hero.x+rand(340,520)}for(let p of [...shots]){if(!targets.includes(p.target)){shots.splice(shots.indexOf(p),1);continue}let dx=p.target.x-p.x,dy=ground-p.target.r-p.y,len=Math.hypot(dx,dy)||1,step=p.v*dt;p.x+=dx/len*step;p.y+=dy/len*step;if(len<step+15){hit(p.target,p.d);shots.splice(shots.indexOf(p),1)}}for(let p of [...particles]){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=360*dt;p.life-=dt;if(p.life<=0)particles.splice(particles.indexOf(p),1)}for(let p of [...texts]){p.y-=35*dt;p.life-=dt;if(p.life<=0)texts.splice(texts.indexOf(p),1)}spawnClock+=dt;if(spawnClock>4&&targets.length<4){spawnClock=0;spawn()}hud()}function cloud(x,y,k=1){circle(x,y,17*k,'#ffffffc4');circle(x+20*k,y-8*k,22*k,'#ffffffc4');circle(x+40*k,y,16*k,'#ffffffc4');rect(x-12*k,y,66*k,13*k,'#ffffffc4')}function bg(){let sky=ctx.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#5aaef0');sky.addColorStop(.7,'#a3e1f5');sky.addColorStop(1,'#f8e5b2');rect(0,0,W,ground,sky);for(let i=0;i<8;i++){let px=((i*235-cam*.13)%(W+300)+W+300)%(W+300)-100;cloud(px,100+i%3*38,.65+i%2*.2)}for(let layer=0;layer<2;layer++){let base=ground-100+layer*50;for(let i=-2;i<W/95+3;i++){let px=i*95-(cam*(.15+layer*.15)%95);poly([[px-30,base+80],[px+52,base-55+(i%3)*12],[px+132,base+80]],layer?'#78b2a2':'#8cbed3')}}for(let i=-2;i<W/85+3;i++){let px=i*85-(cam*.42%85);rect(px+27,ground-77,10,77,'#567d6b');circle(px+30,ground-84,34,'#4d9c77');circle(px+10,ground-88,23,'#70b787');circle(px+45,ground-95,23,'#65ad7d')}rect(0,ground,W,13,'#75c647');rect(0,ground+13,W,8,'#477a38');rect(0,ground+21,W,H-ground,'#78543d');for(let i=-1;i<W/28+2;i++){let px=i*28-(cam%28);rect(px+3,ground+31+(i%3)*11,14,5,'#94694c');rect(px+11,ground+62+(i%4)*9,8,6,'#563f34');rect(px+9,ground+2,4,6,'#a8dc56')}}function tree(a){let xx=a.x-cam,yy=ground;ctx.save();ctx.translate(xx+(a.shake?rand(-4,4):0),yy);let k=a.boss?1.55:1;ctx.scale(k,k);rect(-10,-65,21,66,'#68452f');rect(-5,-61,13,55,'#a16a3d');for(let i=0;i<5;i++)circle(Math.sin(i*2.4)*20,-72-Math.cos(i*1.8)*18,23,i%2?'#4d9b51':'#69b963');circle(-6,-76,4,'#1e3929');circle(10,-76,4,'#1e3929');rect(-1,-64,9,3,'#3c5634');if(a.boss){txt('👑',0,-123,29);txt('BOSS',0,-106,12,'#ff8c7e')}ctx.restore();rect(xx-32*k,yy-106*k,64*k,8,'#233650');rect(xx-30*k,yy-104*k,60*k*Math.max(0,a.hp/a.max),4,a.boss?'#f85b61':'#70ef76')}function dog(x,y,k=1,skin=0){ctx.save();ctx.translate(Math.round(x),Math.round(y+Math.sin(t*9)*2));ctx.scale(k,k);rect(-16,-30,30,20,skin===3?'#71717d':skin===4?'#d98945':'#bb804e');rect(-20,-43,39,24,skin===3?'#9294a9':skin===4?'#e9a64f':'#dca66d');rect(-20,-51,11,15,'#99643f');rect(9,-51,11,15,'#99643f');rect(-10,-35,4,5,'#242536');rect(8,-35,4,5,'#242536');rect(-2,-29,8,5,'#3a2930');rect(-13,-12,8,12,'#79513c');rect(7,-12,8,12,'#79513c');rect(9,-18,18,9,'#354a69');rect(23,-22,13,7,'#738ba9');rect(32,-20,11,3,'#c5d8ee');rect(-12,-21,23,5,'#4a86ba');ctx.restore()}function render(){ctx.clearRect(0,0,W,H);bg();for(let a of targets){if(a.x-cam>-140&&a.x-cam<W+140)tree(a)}for(let i=0;i<s.pets.length;i++){let p=s.pets[i],px=hero.x-cam-52-(i%4)*32,py=ground-34-Math.sin(t*3+i)*12-Math.floor(i/4)*35;circle(px,py,15+p.tier*2,['#ffdc7e','#f6b7dc','#abdfed','#d9baff'][i%4]);txt(petTypes[p.kind%petTypes.length],px,py+6,23);txt('✦'.repeat(Math.min(3,p.tier)),px,py-19,10,'#ffe97b')}dog(hero.x-cam,ground,1.35,s.skin);for(let p of shots){circle(p.x-cam,p.y,p.pet?5:7,p.pet?'#82f7ff':'#ffe878');circle(p.x-cam-6,p.y,3,'#ffffff')}for(let p of particles)rect(p.x-cam,p.y,p.size,p.size,p.color);for(let p of texts)txt(p.text,p.x-cam,p.y,16,p.text.startsWith('-')?'#fff3b4':'#ffe17d');requestAnimationFrame(frame)}function frame(ms){let dt=Math.min(.035,(ms-last)/1000||.016);last=ms;update(dt);render()}requestAnimationFrame(frame);
function row(name,info,label,fn,disabled=false){let d=document.createElement('div');d.className='entry';let left=document.createElement('div');left.innerHTML=`<b>${name}</b><div class="desc">${info}</div>`;let b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.onclick=()=>{fn();open(currentMenu)};d.append(left,b);$('content').append(d)}let currentMenu='growth';function open(menu){currentMenu=menu;modal=true;$('modal').style.display='flex';$('content').innerHTML='';const names={growth:'🐶 Upgrade',weapon:'🔫 Waffen',pets:'🐾 Pets',merge:'✨ Pet-Fusion',skins:'🎨 Hunde-Skins',shop:'🏪 Shop',quest:'🏆 Missionen',help:'⚙️ Hilfe'};$('title').textContent=names[menu]||menu;let cost;if(menu==='growth'){cost=Math.floor(50*Math.pow(1.36,s.atk-1));row('⚔️ Schaden',`Stufe ${s.atk} · +6 ATK`,`${cost} 🪙`,()=>buyCoins(cost,()=>s.atk++));cost=Math.floor(75*Math.pow(1.42,s.rate-1));row('⚡ Feuerrate',`Stufe ${s.rate} · schneller schiessen`,`${cost} 🪙`,()=>buyCoins(cost,()=>s.rate++))}else if(menu==='weapon'){cost=150*(s.gun+1)**2;row('🔫 Blaster',`Waffenstufe ${s.gun+1} · +65% Basisschaden`,`${cost} 🪙`,()=>buyCoins(cost,()=>s.gun++));row('🎯 Auto-Angriff','Schiesst automatisch auf die Bäume',auto?'AN':'AUS',()=>toggleAuto())}else if(menu==='pets'){row('🥚 Pet beschwören',`Du besitzt ${s.pets.length} Pets · max. 12`,'15 💎',()=>{if(s.pets.length>=12)return toast('Maximal 12 Pets');buyGems(15,()=>{s.pets.push({kind:Math.floor(rand(0,petTypes.length)),tier:1});toast('🐾 Neues Pet!')})});s.pets.forEach((p,i)=>row(`${petTypes[p.kind]} Pet ${i+1}`,`Stern-Stufe ${p.tier} · greift automatisch an`,'⭐',()=>toast('Im Fusion-Menü verbessern!')))}else if(menu==='merge'){row('✨ 3 gleiche Pets fusionieren','3 Pets gleicher Art und Stufe → 1 stärkeres Pet','FUSION',()=>{let groups={};s.pets.forEach((p,i)=>(groups[p.kind+'-'+p.tier]??=[]).push(i));let g=Object.values(groups).find(a=>a.length>=3);if(!g)return toast('3 gleiche Pets benötigt');let p={...s.pets[g[0]],tier:s.pets[g[0]].tier+1};s.pets=s.pets.filter((_,i)=>!g.slice(0,3).includes(i));s.pets.push(p);toast('✨ Fusion erfolgreich!')});row('🥚 Weitere Pets','Beschwöre Pets im Pets-Menü','ÖFFNEN',()=>open('pets'))}else if(menu==='skins'){skins.forEach((sk,i)=>row(`${sk} ${['Shiba','Welpe','Pudel','Wolf','Fuchs','Dalmatiner'][i]}`,s.unlocked.includes(i)?'Freigeschaltet':'Neuer Hunde-Look',s.skin===i?'AKTIV':s.unlocked.includes(i)?'ANZIEHEN':'40 💎',()=>{if(s.unlocked.includes(i)){s.skin=i;toast('Skin gewechselt')}else buyGems(40,()=>{s.unlocked.push(i);s.skin=i;toast('🎨 Skin freigeschaltet!')})}))}else if(menu==='shop'){row('💰 Münzbeutel','Erhalte 500 Münzen','10 💎',()=>buyGems(10,()=>s.coins+=500));row('🎁 Tagesgeschenk','Einmal je Kalendertag 100 Münzen + 5 Diamanten','HOLEN',()=>{let day=new Date().toDateString();if(s.giftDay===day)return toast('Heute schon abgeholt!');s.giftDay=day;s.coins+=100;s.gems+=5;toast('🎁 Geschenk erhalten!')})}else if(menu==='quest'){row('🌳 Baumjäger',`${s.kills} Bäume besiegt`,'WEITER',()=>toast('Weiter Bäume zerstören!'));row('👑 Boss-Jagd','Alle 5 Wellen erscheint ein Boss','LOS',()=>close())}else{let d=document.createElement('div');d.className='desc';d.innerHTML='Bewege deinen Hund mit dem Joystick links. Mit FEUER schiesst du, oder du aktivierst AUTO. Zerstöre Bäume, sammle Münzen und Diamanten, verbessere deine Waffen und verschmelze drei gleiche Pets.<p>Dein Fortschritt wird automatisch auf diesem Gerät gespeichert.</p>'; $('content').append(d)}hud()}function buyCoins(n,fn){if(s.coins<n)return toast('🪙 Nicht genug Münzen');s.coins-=n;fn();save();hud()}function buyGems(n,fn){if(s.gems<n)return toast('💎 Nicht genug Diamanten');s.gems-=n;fn();save();hud()}function close(){modal=false;$('modal').style.display='none'}$('close').onclick=close;document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>open(b.dataset.menu));function toggleAuto(){auto=!auto;$('auto').textContent=auto?'⚔️ AUTO AN':'⚔️ AUTO AUS';$('auto').classList.toggle('on',auto)}$('auto').onclick=toggleAuto;const stick=$('joystick'),knob=$('knob');function joy(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2);move=clamp(dx/35,-1,1);knob.style.transform=`translate(${move*27}px,0)`}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);joy(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))joy(e)});function release(){move=0;knob.style.transform=''}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);$('fire').addEventListener('pointerdown',e=>{e.preventDefault();fire=true;$('fire').setPointerCapture(e.pointerId)});$('fire').addEventListener('pointerup',()=>fire=false);$('fire').addEventListener('pointercancel',()=>fire=false);addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')move=-1;if(e.key==='ArrowRight'||e.key==='d')move=1});addEventListener('keyup',e=>{keys[e.key]=false;if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))move=0});hud();toast('🐶 Willkommen bei Dog Gunner!');})();
</script></body></html>
