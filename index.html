<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#162b36"><title>Dog Gunner — Waldabenteuer</title><style>*{box-sizing:border-box}body{margin:0;background:#10202c;color:#fff;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}#app{max-width:560px;margin:auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#142c3a}header{padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#203c4b;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;font-weight:800}header span{background:#112a36;border:1px solid #517281;border-radius:12px;padding:7px}#scene{position:relative;flex:1;min-height:180px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;left:12px;right:12px;top:12px;pointer-events:none}#bosslabel{text-align:center;font-weight:900;text-shadow:0 2px 4px #000;font-size:15px}#bar{height:18px;border:3px solid #fff8;border-radius:16px;background:#2c2b39;overflow:hidden;box-shadow:0 3px 7px #0005}#fill{height:100%;width:100%;background:linear-gradient(90deg,#f97d52,#ffcf66);transition:width .1s}#tip{position:absolute;bottom:10px;left:10px;right:10px;text-align:center;text-shadow:0 2px 4px #000;font-size:12px;font-weight:700;pointer-events:none}#panel{height:40%;min-height:265px;background:#203d4b;border-top:4px solid #8bcbd1;display:flex;flex-direction:column}nav{display:flex;gap:4px;padding:7px 7px 0}nav button{flex:1;padding:10px 2px;background:#315968;color:#d4edf2;border:0;border-radius:10px 10px 0 0;font-weight:800;font-size:12px}nav button.active{background:#e9bc62;color:#332719}#content{flex:1;overflow:auto;padding:10px 12px 20px;overscroll-behavior:contain}button{touch-action:manipulation;cursor:pointer}button:disabled{opacity:.5}.item{background:#315361;border:1px solid #5f8290;border-radius:12px;padding:10px;margin:6px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.item small{display:block;color:#c0d5d8;font-size:11px;margin-top:3px}.item button,.big{background:linear-gradient(#ffe39a,#ecad48);border:2px solid #fff5b8;color:#4d3215;border-radius:10px;font-weight:900;padding:9px 12px}.big{width:100%;margin:5px 0}.pill{background:#19313e;border-radius:8px;padding:6px 8px}.pets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.pet{border:2px solid #7895a1;border-radius:12px;text-align:center;background:#355d68;padding:7px 2px;font-size:11px}.pet b{display:block;font-size:29px}.pet.selected{border-color:#ffde80;background:#576448}.notice{text-align:center;color:#ffdd91;font-size:12px;min-height:18px}h3{margin:8px 0}p{margin:8px 0;font-size:13px;line-height:1.5}</style></head><body><div id="app"><header><strong>🐶 DOG GUNNER</strong><span id="gold">🪙 0</span><span id="gems">💎 0</span><span id="stage">🌲 1-1</span></header><div id="scene"><canvas id="game"></canvas><div id="hud"><div id="bosslabel"></div><div id="bar"><div id="fill"></div></div></div><div id="tip">🌳 Bäume automatisch angreifen · Tippe für Extraschaden!</div></div><div id="panel"><nav><button data-tab="upgrade" class="active">⚔️ Upgrades</button><button data-tab="pets">🐾 Pets</button><button data-tab="gear">🔫 Waffen</button><button data-tab="world">🗺️ Welt</button></nav><div id="content"></div><div class="notice" id="notice"></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('game'),ctx=cv.getContext('2d');let w=400,h=400,tab='upgrade',selected=null,particles=[],shots=[],floaters=[],last=performance.now(),attackClock=0,petClock=0,saveClock=0,shake=0;const worlds=[{name:'Honigwald',sky:'#9cdbed',ground:'#7fb36b',tree:'#458e5c',trunk:'#99603b'},{name:'Kirschhain',sky:'#f3c8d5',ground:'#92c57a',tree:'#ef8bb3',trunk:'#8c5b53'},{name:'Kristallforst',sky:'#b2b8f0',ground:'#6b9bb2',tree:'#69d3da',trunk:'#6b579b'},{name:'Mondwald',sky:'#425b96',ground:'#617b87',tree:'#a28ddd',trunk:'#544777'}];const species=[['🐰','Hoppel'],['🦊','Füchsli'],['🐼','Panda'],['🐥','Küken'],['🐸','Fröschli'],['🦄','Einhorn'],['🐉','Mini-Drache'],['🦋','Falter']];const dogs=['🐶','🐕','🐩','🐕‍🦺'];const guns=['Holz-Blaster','Sternenwerfer','Honigkanone','Kristall-Laser','Drachenstrahl'];const rarity=['C','B','A','S','SS','SSS','X','XX','XXX','ZZZ'];let s;try{s=JSON.parse(localStorage.getItem('dogGunnerSaveV2')||'null')}catch{};s=Object.assign({gold:0,gems:40,level:1,world:0,damage:1,speed:1,crit:0,gun:0,dog:0,pets:[{id:0,tier:0},{id:1,tier:0}],wins:0},s||{});let hp=1,maxhp=1,boss=false,treeIndex=0;const fmt=n=>n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.floor(n).toString();const damage=()=>Math.floor((5+Math.pow(s.damage,1.65)*4)*(1+s.gun*.9));const rate=()=>Math.max(.13,.8*Math.pow(.91,s.speed));const petPower=()=>s.pets.reduce((n,p)=>n+Math.floor(2*Math.pow(2.25,p.tier)),0);const cost=(base,lv)=>Math.floor(base*Math.pow(1.32,lv-1));function save(){try{localStorage.setItem('dogGunnerSaveV2',JSON.stringify(s))}catch{}}function resetTree(){boss=s.level%5===0;treeIndex=s.level;maxhp=Math.floor((boss?180:42)*Math.pow(1.28,s.level-1));hp=maxhp;updateHud()}function updateHud(){$('gold').textContent='🪙 '+fmt(s.gold);$('gems').textContent='💎 '+fmt(s.gems);$('stage').textContent='🌲 '+(s.world+1)+'-'+s.level;$('bosslabel').textContent=boss?'👑 WALD-BOSS · '+fmt(Math.max(0,hp))+' / '+fmt(maxhp):'🌳 Baum Stufe '+s.level+' · '+fmt(Math.max(0,hp))+' / '+fmt(maxhp);$('fill').style.width=(100*Math.max(0,hp)/maxhp)+'%'}function notify(msg){$('notice').textContent=msg;setTimeout(()=>{if($('notice').textContent===msg)$('notice').textContent=''},2300)}function hurt(n,x=w*.7,y=h*.5){let crit=Math.random()<s.crit*.025;n=Math.ceil(n*(crit?2:1));hp-=n;shake=5;floaters.push({x,y,text:(crit?'KRIT! ':'')+fmt(n),life:1});for(let i=0;i<7;i++)particles.push({x,y,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*130,life:.5,color:boss?'#ffda77':'#c1ff9e'});if(hp<=0){let reward=Math.floor((boss?100:17)*Math.pow(1.27,s.level-1));s.gold+=reward;if(boss)s.gems+=8;s.wins++;s.level++;if(s.level>20){s.level=1;s.world=(s.world+1)%worlds.length;s.gems+=20;notify('🌟 Neue Welt freigeschaltet!')}else notify((boss?'👑 Boss besiegt! ':'🌳 Baum gefällt! ')+'+'+fmt(reward)+' 🪙');resetTree();render();save()}updateHud()};function drawEllipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function round(x,y,a,b,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,a,b,r);ctx.fill()}function renderScene(dt,t){let world=worlds[s.world];ctx.clearRect(0,0,w,h);ctx.fillStyle=world.sky;ctx.fillRect(0,0,w,h);let horizon=h*.65;ctx.fillStyle='#ffffff35';for(let i=0;i<5;i++)drawEllipse((i*125+25)%w,45+(i%3)*29,45,14,'#ffffff66');ctx.fillStyle=world.ground;ctx.fillRect(0,horizon,w,h-horizon);for(let i=0;i<13;i++){let x=(i*91+23)%w,y=horizon+20+(i*47)%(h-horizon-20);drawEllipse(x,y,10,4,'#5a965c88')}ctx.save();ctx.translate(shake*(Math.random()-.5),0);let tx=w*.72,ty=h*.56,sz=Math.min(w,h)*.24*(boss?1.25:1);drawEllipse(tx,ty+sz*.98,sz*.7,sz*.16,'#263c3b55');round(tx-sz*.18,ty+sz*.2,sz*.36,sz*.8,8,world.trunk);let crown=world.tree;for(let [dx,dy,r] of [[0,-.15,.65],[-.42,.08,.49],[.43,.06,.51],[0,.3,.55]]){drawEllipse(tx+sz*dx,ty+sz*dy,sz*r,sz*r,crown)}for(let i=0;i<9;i++){let a=i*2.4;drawEllipse(tx+Math.sin(a)*sz*.48,ty+Math.cos(a)*sz*.35,sz*.085,sz*.09,boss?'#ffdf72':'#d8f6b2')}if(boss){ctx.font=`${sz*.48}px serif`;ctx.textAlign='center';ctx.fillText('👑',tx,ty-sz*.6)}let dx=w*.23,dy=h*.74,ds=Math.min(w,h)*.21;drawEllipse(dx,dy+ds*.5,ds*.55,ds*.13,'#263c3b55');ctx.font=`${ds*1.7}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(dogs[s.dog],dx,dy+Math.sin(t*4)*2);round(dx+ds*.32,dy-ds*.12,ds*.63,ds*.19,6,['#7353a6','#f5c65e','#ff7d6e','#76d6ee','#d6a3fa'][s.gun]);ctx.fillStyle='#ffeaa6';ctx.beginPath();ctx.moveTo(dx+ds*.95,dy-ds*.1);ctx.lineTo(dx+ds*1.12,dy);ctx.lineTo(dx+ds*.95,dy+ds*.06);ctx.fill();s.pets.slice(0,5).forEach((p,i)=>{let px=w*(.11+i*.12),py=h*(.89+(i%2)*.025)+Math.sin(t*3+i)*3;drawEllipse(px,py+12,16,5,'#263c3b44');ctx.font=`${Math.min(w,h)*.083}px serif`;ctx.fillText(species[p.id][0],px,py);ctx.font='bold 10px system-ui';ctx.fillStyle='#fff';ctx.fillText(rarity[p.tier],px,py-24)});ctx.restore();for(let sh of shots){ctx.strokeStyle=sh.pet?'#b6faff':'#ffef9a';ctx.lineWidth=sh.pet?3:5;ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(sh.x+sh.vx*.025,sh.y+sh.vy*.025);ctx.stroke()}for(let p of particles){ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.textAlign='center';ctx.font='bold 17px system-ui';for(let f of floaters){ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle='#fff';ctx.strokeStyle='#3c4c4c';ctx.lineWidth=3;ctx.strokeText(f.text,f.x,f.y);ctx.fillText(f.text,f.x,f.y)}ctx.globalAlpha=1}function fire(pet=false){shots.push({x:w*(pet?.2:.34),y:h*(pet?.85:.73),vx:w*1.7,vy:-h*.36,pet,life:.28});hurt(pet?petPower():damage(),w*.72,h*.52)}function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;attackClock+=dt;petClock+=dt;saveClock+=dt;if(attackClock>=rate()){attackClock=0;fire()}if(petClock>=1.2){petClock=0;if(s.pets.length)fire(true)}for(let a of shots){a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt}shots=shots.filter(a=>a.life>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(let f of floaters){f.y-=35*dt;f.life-=dt}floaters=floaters.filter(f=>f.life>0);shake=Math.max(0,shake-dt*35);if(saveClock>5){saveClock=0;save()}renderScene(dt,now/1000);requestAnimationFrame(loop)}function button(text,fn,disabled=false){let b=document.createElement('button');b.textContent=text;b.disabled=disabled;b.onclick=fn;return b}function row(name,desc,label,fn,disabled=false){let d=document.createElement('div');d.className='item';let l=document.createElement('div');l.innerHTML='<b>'+name+'</b><small>'+desc+'</small>';d.append(l,button(label,fn,disabled));$('content').append(d)}function render(){updateHud();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let c=$('content');c.innerHTML='';if(tab==='upgrade'){let d=cost(22,s.damage),sp=cost(30,s.speed),cr=cost(55,s.crit+1);row('⚔️ Schaden · Lv '+s.damage,'Aktuell: '+fmt(damage())+' pro Treffer','🪙 '+fmt(d),()=>buy(d,()=>s.damage++),s.gold<d);row('⚡ Feuerrate · Lv '+s.speed,'Alle '+rate().toFixed(2)+' Sekunden','🪙 '+fmt(sp),()=>buy(sp,()=>s.speed++),s.gold<sp);row('✨ Kritischer Treffer · Lv '+s.crit,(s.crit*2.5).toFixed(1)+'% Chance auf doppelten Schaden','🪙 '+fmt(cr),()=>buy(cr,()=>s.crit++),s.gold<cr||s.crit>=35);row('👆 Tippen zum Angreifen','Tippe auf den Baum für einen Extra-Treffer','Los!',()=>{hurt(damage()*2);render()})}else if(tab==='pets'){let p=document.createElement('p');p.textContent='Zwei identische Pets derselben Stufe verschmelzen zu einem stärkeren Pet. Maximal 5 aktive Begleiter greifen mit an.';c.append(p);let grid=document.createElement('div');grid.className='pets';s.pets.forEach((p,i)=>{let el=document.createElement('div');el.className='pet'+(selected===i?' selected':'');el.innerHTML='<b>'+species[p.id][0]+'</b>'+species[p.id][1]+'<br><strong>'+rarity[p.tier]+'</strong>';el.onclick=()=>{selected=i;render()};grid.append(el)});c.append(grid);let summon=button('🥚 Pet beschwören · 💎 15',()=>{if(s.gems<15)return notify('Zu wenig Diamanten!');s.gems-=15;s.pets.push({id:Math.floor(Math.random()*species.length),tier:0});selected=null;save();render()},s.gems<15||s.pets.length>=30);summon.className='big';c.append(summon);let merge=button('💞 Ausgewähltes Pet verschmelzen',()=>{if(selected===null||!s.pets[selected])return notify('Wähle zuerst ein Pet!');let a=s.pets[selected];if(a.tier>=9)return notify('Bereits ZZZ!');let other=s.pets.findIndex((p,i)=>i!==selected&&p.id===a.id&&p.tier===a.tier);if(other<0)return notify('Du brauchst dasselbe Pet mit derselben Stufe!');s.pets.splice(Math.max(selected,other),1);s.pets.splice(Math.min(selected,other),1);s.pets.push({id:a.id,tier:a.tier+1});selected=null;notify('✨ Fusion gelungen!');save();render()});merge.className='big';c.append(merge);let inf=document.createElement('p');inf.textContent='Pet-Schaden: '+fmt(petPower())+' · Sammlung: '+s.pets.length+'/30';c.append(inf)}else if(tab==='gear'){row('🔫 '+guns[s.gun],'Waffenschaden-Multiplikator: x'+(1+s.gun*.9).toFixed(1),s.gun>=4?'MAX':'💎 '+(30+s.gun*35),()=>{let n=30+s.gun*35;if(s.gems>=n){s.gems-=n;s.gun++;save();render()}},s.gun>=4||s.gems<30+s.gun*35);row('🐶 Hunde-Skin',dogs[s.dog]+' · Tippe zum Wechseln','Wechseln',()=>{s.dog=(s.dog+1)%dogs.length;save();render()});let p=document.createElement('p');p.textContent='Neue Waffen und Hunde-Skins sind eigene Designs für Dog Gunner.';c.append(p)}else{let p=document.createElement('p');p.innerHTML='<b>🌲 '+worlds[s.world].name+'</b><br>Baum-Level: '+s.level+' / 20<br>Besiegte Bäume und Bosse: '+s.wins+'<br>Jeder 5. Baum ist ein Boss. Nach Level 20 beginnt die nächste Welt.';c.append(p);row('👑 Bosskampf','Jeder fünfte Level · Extra-Diamanten','Weiterkämpfen',()=>{tab='upgrade';render()});let b=button('💾 Spielstand jetzt speichern',()=>{save();notify('Gespeichert!')});b.className='big';c.append(b)}}function buy(n,act){if(s.gold<n)return; s.gold-=n;act();save();render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selected=null;render()});cv.addEventListener('pointerdown',e=>{e.preventDefault();hurt(damage()*2,e.offsetX,e.offsetY);render()});function resize(){let r=cv.getBoundingClientRect();w=r.width;h=r.height;let dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.floor(w*dpr);cv.height=Math.floor(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();resetTree();render();requestAnimationFrame(loop);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()})})();
</script></body></html>
